<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audition ABM/TBM Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <!-- Player Card Container -->
  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
          AyoDance Web Player
        </h1>
        <p class="text-xs text-slate-400">Stream langsung dari .tbm repository</p>
      </div>
      <span class="px-2.5 py-1 text-xs font-semibold bg-pink-500/10 text-pink-400 rounded-full border border-pink-500/20">ABM Core</span>
    </div>

    <!-- Active Song Info -->
    <div class="text-center py-4 bg-slate-800/40 rounded-2xl mb-6 border border-slate-800">
      <div class="w-20 h-20 mx-auto mb-3 bg-gradient-to-tr from-pink-600 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-pink-500/20">
        <i class="fa-solid fa-music text-3xl text-white"></i>
      </div>
      <h2 id="current-title" class="text-lg font-bold text-slate-200 truncate px-4">Memuat Playlist...</h2>
      <p id="current-file" class="text-xs text-slate-400 font-mono mt-1">-</p>
    </div>

    <!-- Progress Bar -->
    <div class="mb-4">
      <input type="range" id="seek-bar" value="0" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-pink-500">
      <div class="flex justify-between text-[11px] text-slate-400 font-mono mt-1">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-center gap-6 mb-6">
      <button id="prev-btn" class="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition">
        <i class="fa-solid fa-backward-step text-lg"></i>
      </button>

      <button id="play-btn" class="w-14 h-14 bg-pink-500 hover:bg-pink-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-pink-500/30 transition transform hover:scale-105 active:scale-95">
        <i id="play-icon" class="fa-solid fa-play text-xl ml-0.5"></i>
      </button>

      <button id="next-btn" class="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition">
        <i class="fa-solid fa-forward-step text-lg"></i>
      </button>
    </div>

    <!-- Custom Search -->
    <div class="flex gap-2 mb-4">
      <input type="text" id="custom-input" placeholder="Cari atau ketik nama file (ex: k0093.tbm)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
      <button id="load-custom-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl transition">
        Play
      </button>
    </div>

    <!-- Playlist Section -->
    <div class="border-t border-slate-800/80 pt-4">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Daftar Putar Server (Otomatis)</p>
      <div id="playlist-container" class="max-h-48 overflow-y-auto space-y-1 pr-1 custom-scrollbar">
        <!-- Item Playlist diisi via JavaScript -->
        <p class="text-xs text-slate-500 text-center py-4">Mendeteksi file dari server...</p>
      </div>
    </div>

  </div>

  <audio id="audio-player" class="hidden"></audio>

  <style>
    /* Styling for scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>

  <script>
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const durationEl = document.getElementById('duration');
    const currentTitleEl = document.getElementById('current-title');
    const currentFileEl = document.getElementById('current-file');
    const playlistContainer = document.getElementById('playlist-container');
    const customInput = document.getElementById('custom-input');
    const loadCustomBtn = document.getElementById('load-custom-btn');

    let playlist = [];
    let currentIndex = 0;

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    async function loadPlaylist() {
      try {
        const res = await fetch('/api/playlist');
        playlist = await res.json();
        renderPlaylist();
        if (playlist.length > 0) {
          selectTrack(0, false);
        } else {
            playlistContainer.innerHTML = '<p class="text-xs text-red-500 text-center py-4">Gagal memuat playlist.</p>';
            currentTitleEl.innerText = "Playlist Kosong";
        }
      } catch (err) {
        playlistContainer.innerHTML = '<p class="text-xs text-red-500 text-center py-4">Error koneksi ke server.</p>';
        currentTitleEl.innerText = "Error";
      }
    }

    function renderPlaylist(filterText = '') {
      playlistContainer.innerHTML = '';
      const filtered = playlist.filter(t => t.id.toLowerCase().includes(filterText.toLowerCase()));
      
      if(filtered.length === 0) {
           playlistContainer.innerHTML = '<p class="text-xs text-slate-500 text-center py-4">Lagu tidak ditemukan.</p>';
           return;
      }

      filtered.forEach((track) => {
        const originalIndex = playlist.findIndex(t => t.id === track.id);
        const item = document.createElement('button');
        item.className = `w-full text-left p-2.5 rounded-xl text-xs flex justify-between items-center transition ${originalIndex === currentIndex ? 'bg-pink-500/20 text-pink-400 font-semibold' : 'text-slate-400 hover:bg-slate-800/60'}`;
        item.innerHTML = `
          <div class="truncate">
            <span>${track.title || track.id}</span>
          </div>
          <span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-300 ml-2">${track.id}</span>
        `;
        item.onclick = () => selectTrack(originalIndex, true);
        playlistContainer.appendChild(item);
      });
    }

    function selectTrack(index, autoPlay = true) {
      currentIndex = index;
      const track = playlist[index];
      currentTitleEl.innerText = track.title || track.id;
      currentFileEl.innerText = track.id;
      audio.src = `/stream/${track.id}`;
      renderPlaylist(customInput.value);

      if (autoPlay) {
        audio.play().catch(e=>console.log("Auto-play prevented by browser"));
        playIcon.classList.replace('fa-play', 'fa-pause');
      }
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playIcon.classList.replace('fa-play', 'fa-pause');
      } else {
        audio.pause();
        playIcon.classList.replace('fa-pause', 'fa-play');
      }
    });

    nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % playlist.length;
      selectTrack(currentIndex, true);
    });

    prevBtn.addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      selectTrack(currentIndex, true);
    });

    audio.addEventListener('timeupdate', () => {
      seekBar.value = (audio.currentTime / audio.duration) * 100 || 0;
      currentTimeEl.innerText = formatTime(audio.currentTime);
    });

    audio.addEventListener('loadedmetadata', () => {
      durationEl.innerText = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      nextBtn.click();
    });

    seekBar.addEventListener('input', () => {
      audio.currentTime = (seekBar.value / 100) * audio.duration;
    });
    
    // Fitur Live Search & Custom Load
    customInput.addEventListener('input', (e) => {
        renderPlaylist(e.target.value);
    });

    loadCustomBtn.addEventListener('click', () => {
      const val = customInput.value.trim();
      if (val) {
        const fileId = val.endsWith('.tbm') ? val : val + '.tbm';
        // Cek apakah sudah ada di playlist
        let idx = playlist.findIndex(t => t.id === fileId);
        if(idx === -1) {
            playlist.unshift({ id: fileId, title: `Custom Track (${fileId})` });
            idx = 0;
        }
        selectTrack(idx, true);
      }
    });

    // Mulai memuat
    loadPlaylist();
  </script>
</body>
</html>
