<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audition ABM/TBM Music Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl backdrop-blur-md">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
          AyoDance Web Player
        </h1>
        <p class="text-xs text-slate-400">Client-Side Processing Mode</p>
      </div>
      <span class="px-2.5 py-1 text-xs font-semibold bg-pink-500/10 text-pink-400 rounded-full border border-pink-500/20">JS Engine</span>
    </div>

    <!-- Active Song Info -->
    <div class="text-center py-4 bg-slate-800/40 rounded-2xl mb-6 border border-slate-800">
      <div class="w-20 h-20 mx-auto mb-3 bg-gradient-to-tr from-pink-600 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-pink-500/20">
        <i class="fa-solid fa-music text-3xl text-white"></i>
      </div>
      <h2 id="current-title" class="text-lg font-bold text-slate-200 truncate px-4">Memuat Playlist...</h2>
      <p id="current-file" class="text-xs text-slate-400 font-mono mt-1">-</p>
    </div>

    <!-- Progress Bar -->
    <div class="mb-4">
      <input type="range" id="seek-bar" value="0" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-pink-500">
      <div class="flex justify-between text-[11px] text-slate-400 font-mono mt-1">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex items-center justify-center gap-6 mb-6">
      <button id="prev-btn" class="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition"><i class="fa-solid fa-backward-step text-lg"></i></button>
      <button id="play-btn" class="w-14 h-14 bg-pink-500 hover:bg-pink-600 text-white rounded-full flex items-center justify-center shadow-lg transition transform hover:scale-105 active:scale-95"><i id="play-icon" class="fa-solid fa-play text-xl ml-0.5"></i></button>
      <button id="next-btn" class="p-3 text-slate-400 hover:text-white hover:bg-slate-800 rounded-full transition"><i class="fa-solid fa-forward-step text-lg"></i></button>
    </div>

    <!-- Playlist Section -->
    <div class="border-t border-slate-800/80 pt-4">
      <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Daftar Putar Server</p>
      <div id="playlist-container" class="max-h-48 overflow-y-auto space-y-1 pr-1">
      </div>
    </div>
  </div>

  <audio id="audio-player" class="hidden"></audio>

  <script>
    const KNOWN_SONGS = {
        "b0000.tbm": "Audition - BGM Intro Default",
        "b0001.tbm": "Audition - Let's Dance"
    };

    const audio = document.getElementById('audio-player');
    let playlist = [];
    let currentIndex = 0;

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // 1. Scraping Playlist Menggunakan Proxy Publik
    async function loadPlaylist() {
      try {
        const targetUrl = 'http://122.102.49.131/audition/ABM/';
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);
        
        const res = await fetch(proxyUrl);
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        doc.querySelectorAll('a').forEach(a => {
            const href = a.getAttribute('href');
            if (href && href.endsWith('.tbm')) {
                const filename = href.split('/').pop();
                playlist.push({ 
                    id: filename, 
                    title: KNOWN_SONGS[filename] || `Track (${filename})`
                });
            }
        });

        if(playlist.length > 0) {
            renderPlaylist();
            document.getElementById('current-title').innerText = "Siap Diputar";
        }
      } catch (err) {
        document.getElementById('current-title').innerText = "Gagal memuat server";
      }
    }

    function renderPlaylist() {
      const container = document.getElementById('playlist-container');
      container.innerHTML = '';
      playlist.forEach((track, idx) => {
        const btn = document.createElement('button');
        btn.className = `w-full text-left p-2.5 rounded-xl text-xs flex justify-between items-center transition ${idx === currentIndex ? 'bg-pink-500/20 text-pink-400 font-semibold' : 'text-slate-400 hover:bg-slate-800'}`;
        btn.innerHTML = `<span>${track.title}</span><span class="text-[10px] bg-slate-800 px-2 py-0.5 rounded text-slate-300">${track.id}</span>`;
        btn.onclick = () => selectTrack(idx);
        container.appendChild(btn);
      });
    }

    // 2. Download dan Potong File
    async function selectTrack(index) {
      currentIndex = index;
      renderPlaylist();
      const track = playlist[index];
      
      document.getElementById('current-title').innerText = "Mengunduh Lagu (Harap Tunggu)...";
      document.getElementById('current-file').innerText = track.id;
      
      try {
        const targetUrl = 'http://122.102.49.131/audition/ABM/' + track.id;
        const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error("Gagal mengunduh");

        const buffer = await res.arrayBuffer();
        const view = new Uint8Array(buffer);
        
        let offset = -1;
        let mime = 'audio/mpeg';

        // Cari header OGG atau MP3
        for (let i = 0; i < view.length - 4; i++) {
            if (view[i] === 79 && view[i+1] === 103 && view[i+2] === 103 && view[i+3] === 83) { // OggS
                offset = i; mime = 'audio/ogg'; break;
            }
            if (view[i] === 73 && view[i+1] === 68 && view[i+2] === 51) { // ID3
                offset = i; break;
            }
            if (view[i] === 255 && (view[i+1] === 251 || view[i+1] === 250 || view[i+1] === 243)) { // \xFF\xFB (MP3 Sync)
                offset = i; break;
            }
        }

        if (offset === -1) {
            document.getElementById('current-title').innerText = "Error: File Terenkripsi (XOR)";
            return;
        }

        // Potong Header Audition
        const cleanBuffer = buffer.slice(offset);
        const blob = new Blob([cleanBuffer], { type: mime });
        
        // Hapus URL memori lama agar tidak lemot
        if (audio.src) URL.revokeObjectURL(audio.src);
        
        const url = URL.createObjectURL(blob);
        audio.src = url;
        audio.play();
        
        document.getElementById('current-title').innerText = track.title;
        document.getElementById('play-icon').classList.replace('fa-play', 'fa-pause');
      } catch (err) {
        document.getElementById('current-title').innerText = "Koneksi ke server gagal";
      }
    }

    // Controls
    document.getElementById('play-btn').onclick = () => {
      if (audio.paused) { audio.play(); document.getElementById('play-icon').classList.replace('fa-play', 'fa-pause'); } 
      else { audio.pause(); document.getElementById('play-icon').classList.replace('fa-pause', 'fa-play'); }
    };
    document.getElementById('next-btn').onclick = () => selectTrack((currentIndex + 1) % playlist.length);
    document.getElementById('prev-btn').onclick = () => selectTrack((currentIndex - 1 + playlist.length) % playlist.length);

    audio.ontimeupdate = () => {
      document.getElementById('seek-bar').value = (audio.currentTime / audio.duration) * 100 || 0;
      document.getElementById('current-time').innerText = formatTime(audio.currentTime);
    };
    audio.onloadedmetadata = () => document.getElementById('duration').innerText = formatTime(audio.duration);
    audio.onended = () => document.getElementById('next-btn').click();
    document.getElementById('seek-bar').oninput = (e) => audio.currentTime = (e.target.value / 100) * audio.duration;

    loadPlaylist();
  </script>
</body>
</html>
